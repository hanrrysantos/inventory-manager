server:
  port: ${PORT:8080}
  address: 0.0.0.0

frontend:
  origins: ${FRONTEND_ORIGINS:http://localhost:5173}

spring:
  application:
    name: inventory-manager

  profiles:
    active: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: ${RESTOCK_NOTIFICATION_MAX_ATTEMPTS:3}
        default-requeue-rejected: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:}
  to: ${RESEND_TO:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operation-sorter: alpha
    displayOperationId: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    rabbit:
      enabled: false
    db:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-}] : %msg%n"
