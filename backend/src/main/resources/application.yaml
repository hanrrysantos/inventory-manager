server:
  port: ${PORT:8080}
  address: 0.0.0.0

frontend:
  origins: ${FRONTEND_ORIGINS:http://localhost:5173}

spring:
  application:
    name: inventory-manager

  profiles:
    active: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:}
  to: ${RESEND_TO:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operation-sorter: alpha
    displayOperationId: false
