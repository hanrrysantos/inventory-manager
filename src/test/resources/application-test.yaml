spring:
  task:
    scheduling:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: test-secret-test-secret-test-secret-test-secret
  expiration: 3600000
